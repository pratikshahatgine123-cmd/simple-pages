
<!DOCTYPE html>
<html>
<head>
    <title>Student Hub | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(90deg, #6d28d9, #2563eb);
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .card {
            width: 400px;
            background: white;
            margin: 70px auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #5b21b6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #6d28d9;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #6d28d9, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        .links a {
            color: #5b21b6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🎓 Student Hub</div>

        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>

    <div class="card">

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">Login to your account</p>

        <form>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter your password">

            <button type="submit">Login</button>

        </form>

        <div class="links">
            <a href="reset-password.html">Forgot Password?</a>

            <br>

            Don't have an account?
            <a href="register.html">Register</a>
        </div>

    </div>

</body>
</html>
