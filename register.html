
<!DOCTYPE html>
<html>
<head>
    <title>Student Hub | Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ede9fe, #dbeafe);
            min-height: 100vh;
        }

        nav {
            background: linear-gradient(90deg, #6d28d9, #2563eb);
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .card {
            width: 450px;
            background: white;
            margin: 45px auto;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #5b21b6;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #6d28d9;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #6d28d9, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .bottom {
            text-align: center;
            margin-top: 18px;
        }

        .bottom a {
            color: #5b21b6;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🎓 Student Hub</div>

        <div>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="feedback.html">Feedback</a>
        </div>
    </nav>

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">Join Student Hub today</p>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number">

            <label>Password</label>
            <input type="password" placeholder="Create password">

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm password">

            <button type="submit">Create Account</button>

        </form>

        <div class="bottom">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</body>
</html>
